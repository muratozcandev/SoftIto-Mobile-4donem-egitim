    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Offline-first Taslak & Sepet Depolama </title>
        <link rel="stylesheet" href="taslak_depo.css">
    </head>

    <body>
        <div class="card">
            <span class="badge">Otomatik offline kayıt aktif</span>
            <h3>Müşteri Arıza & Destek Kayıt Formu</h3>
            <p style="font-size: 12px; color:#64748b; margin-bottom:16px;">Tarayıcıyı kapatsanız bile bunlar kayır olarak
                kalacaktır</p>

            <form id="supportForm">
                <div class="form-group">
                    <label for="txtName">Müşteri Ad Soyad:</label>
                    <input type="text" id="txtName" name="name" placeholder="Ahmet Yılmaz">
                </div>
                
                <div class=" form-group">
                    <label for="txtDevice">Cihaz modeli & Seri no:</label>
                    <input type="text" name="device" id="txtDevice" placeholder="iphone 18 pro max">
                </div>

                <div class="form-group">
                    <label for="txtDesc">Arıza Detayı:</label>
                    <textarea id="txtDesc" name="desc" rows="4" placeholder="cihazın arızasını detaylandırın"></textarea>
                </div>

                <div class="status-msg" id="statusLog"></div>

                <div class="btn-group">
                    <button type="sumbit" class="btn-sumbit">Kaydı tamamla</button>
                    <button type="button" id="btnClear" class="btn-Clear">Taslağı sıfırla</button>
                </div>
            </form>
        </div>

        <script>
            const STORAGE_KEY = 'trossard_support_softito';
            const form = document.getElementById('supportForm');
            const nameInput = document.getElementById('txtName');
            const deviceInput = document.getElementById('txtDevice');
            const descInput = document.getElementById('txtDesc');
            const statusLog = document.getElementById('statusLog');
            const btnClear = document.getElementById('btnClear');

            window.addEventListener('DOMContentLoaded', () => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    try {
                        const draft = JSON.parse(savedData);
                        nameInput.value = draft.name || "";
                        deviceInput.value = draft.device || "";
                        descInput.value = draft.desc || "";
                        statusLog.innerText = `Önceki Taslak geri yüklendi (${draft.lastSaved})`;


                    } catch (e) {
                        console.error("Taslak parse hatası:", e)
                    }
                }
            });

            form.addEventListener('input', () => {
                const draftData = {
                    name: nameInput.value,
                    device: deviceInput.value,
                    desc: descInput.value,
                    lastSaved: new Date().toLocaleDateString('tr-TR')

                }

                localStorage.setItem(STORAGE_KEY, JSON.stringify(draftData));
                statusLog.innerText = `Taslak otomatik olarak kaydedildi: ${draftData.lastSaved}`;

            });

            form.addEventListener('sumbit',()=>{
                e.preventDefault();
                alert('destek talebiniz başarıytla merkeze iletildi');
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
                statusLog.innerText('form temizlendi, taslak alındı');
            });

            btnClear.addEventListener('click', ()=>{
                if(confirm('taslağı silmke istediğinize emin misiniz?')){
                    localStorage.removeItem(STORAGE_KEY);
                    form.reset();
                    statusLog.innerText="Taslak silindi";
                }
            });

            window.addEventListener('storage',(event)=>{
                if(event.key===STORAGE_KEY && event.newValue){
                    const remoteDraft= JSON.parse(event.newValue);
                    nameInput.value=remoteDraft.name||"";
                    deviceInput.value=remoteDraft.device ||"";
                    descInput.value=remoteDraft.desc ||"";
                    statusLog.innerText = `diğer sekmeden güncellendi ${remoteDraft.lastSaved}`;                    
                }
            })



        </script>
    </body>

    </html>
