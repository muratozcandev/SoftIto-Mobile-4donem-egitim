<body>

    <div class="box-container">

        <!-- CONTENT-BOX ÖRNEĞİ -->
        <h3>content-box (taşma yapan eleman)</h3>

        <div class="broken-box">
            Ekrandan dışarı taşan kutu
        </div>


        <!-- BORDER-BOX ÖRNEĞİ -->

        <div class="fixed-box">
            Taşma yapmayan kutu

            <div
                class="truncate-text"
                title="Bu çok uzun bir IBAN veya sipariş numarası veya ekstra metin olabilir"
            >

        </div>

    </div>

</body>
