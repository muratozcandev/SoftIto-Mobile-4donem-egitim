<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayTR 3d secure mobile ödeme sayfası</title>
    <style>
        body{
            font-family: -apple-system,sans-serif;
            padding:16px;
            background-color: #f1f5f9;

        }

        .card{
            background-color: white;
            padding:20px;
            border-radius: 12px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);

        }

        .form-group{
            margin-bottom: 14px;
        }

        label{
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;

        }

        input{
            width : 100%;
            padding: 10 px;
            border:1.5px solid #cba5e1;
            border-radius: 6px;
            box-sizing: border-box;

        }

        .row{
            display: flex;
            gap: 10px;

        }

        .col {
            flex:1;
        }
        .slider-box{
            background:#f8fafc;
            padding: 10px;
            border-radius: 6px;
            border : 1px dashed #94a3b8;

        }

        button[type="sumbit"]{
            width : 100%;
            background: #2563eb;
            color:white;
            padding:12px;
            border:none;


        }

        dialog{
            border:none;
            border-radius: 12px;
            padding: 20px;
            max-width: 360px;
            margin: auto;

        }

        dialog::backdrop{
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <main class="card">
    <h2>PayTr 3d secure</h2>
    <p style="font-size: 12px; color:#cba5e1;margin-bottom: 16px;"><strong>tutar 1,250.00</strong></p>
    <form action="/odeme" method="POST" oninput="outTaksit.value=calcMonthly(rngTaksit.value)">
        <div class = "form-group">
            <label for="cName">Kart Sahibi</label>
            <input type="text" id="cName" name="card_name" required inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000">
        </div>
        <div class = "row">
            <div class = "col form-group">
                <label for="cExp">Son kullanma AA/YY : </label>
                <input type="text" name="card_exp" id="cExp" required inputmode="numeric" maxlength="5" placeholder="12/24">
            </div>
            <div class = "col form-group">
                <label for="cCvv">CVV:</label>
                <input type="password" name="cCvv" id="cCvv" required inputmode="numeric" maxlength="3" placeholder="***">
            </div>
        </div>
    </form>
    </main>
</body>
</html>
